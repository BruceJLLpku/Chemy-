name: Publish question bank

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            dist
            scripts
            data
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/export-requirements.txt
      - name: Install PDF export build dependencies
        run: python -m pip install -r scripts/export-requirements.txt
      - name: Check committed release inputs
        run: python -X utf8 scripts/check_release.py --pdfs
      - name: Restore verified PDF build cache
        uses: actions/cache@v4
        with:
          path: |
            tmp/export-parts
            dist/export-parts
          key: ${{ runner.os }}-python312-clean-vector-v1-${{ hashFiles('scripts/build_export_parts.py', 'scripts/pdf_clip_cleanup.py', 'scripts/pdf_render_verify.py', 'scripts/pdf_font_subset.py', 'scripts/pdf_watermark.py', 'scripts/export-requirements.txt', 'dist/downloads/*.pdf', 'dist/export-index/*.json', 'dist/assets/chemy-watermark.jpg') }}
          restore-keys: |
            ${{ runner.os }}-python312-clean-vector-v1-
      - name: Build clean question and answer PDF parts
        run: python -X utf8 scripts/build_export_parts.py
      - name: Check complete generated export inventory
        run: python -X utf8 scripts/check_release.py --pdfs --parts
      - name: Check generated PDF structure and sample rendered bands
        run: python -X utf8 scripts/test_export_parts.py
      - name: Stage referenced assets and clean books within the Pages size limit
        run: python -X utf8 scripts/stage_site.py --clean-books
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
